[package]
name = "forgetui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal-native modeller and software renderer"
license = "MIT"

[dependencies]
crossterm = "0.28.1"
ratatui = "0.29.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
strip = true
codegen-units = 1
